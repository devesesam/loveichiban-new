[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # A Google Place ID is a public identifier (it's in every Maps URL), not a
  # credential — exclude it from Netlify secrets scanning. The actual secrets
  # (GOOGLE_PLACES_API_KEY, RESEND_API_KEY) are never in the repo or build output.
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_PLACE_ID"

# Old route from the pre-redesign site — About now lives on the homepage.
[[redirects]]
  from = "/about-us"
  to = "/"
  status = 301

# Astro emits content-hashed files under /_astro/ and /assets/.
# These are safe to cache forever — any change to a file changes its hash.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons and manifest are un-hashed — cache for a day.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The catering brochure is served from an unlisted page. PDFs are their own URLs
# and Google indexes them directly, so the page's noindex tag doesn't cover this
# file — it needs its own header.
[[headers]]
  for = "/ichiban-catering-brochure-2026.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"

# HTML must revalidate so new asset hashes are picked up immediately after deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
